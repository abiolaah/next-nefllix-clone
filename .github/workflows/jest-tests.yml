name: Netflix Clone CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Runs every Friday at 11 PM UTC
    - cron: "0 23 * * FRI"
  workflow_dispatch: # Allow manual run

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Run unit tests
        run: |
          mkdir -p test-results
          npm run test:unit -- --ci --coverage --watchAll=false --json --outputFile=test-results/unit-results.json
        env:
          CI: true
        continue-on-error: true

      - name: Upload unit test coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unit-tests
          name: codecov-unit-${{ matrix.node-version }}
          fail_ci_if_error: false

      - name: Archive unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.node-version }}
          path: |
            coverage/
            test-results/
          retention-days: 30

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run integration tests
        run: |
          mkdir -p test-results
          npm run test:integration -- --ci --coverage --watchAll=false --json --outputFile=test-results/integration-results.json
        env:
          CI: true
        continue-on-error: true

      - name: Upload integration test coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: integration-tests
          name: codecov-integration-${{ matrix.node-version }}
          fail_ci_if_error: false

      - name: Archive integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ matrix.node-version }}
          path: |
            coverage/
            test-results/
          retention-days: 30

  e2e-tests:
    name: Run E2E Tests (Playwright)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      # 🎯 NEW: Setup MongoDB for E2E tests
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: "6.0"
          mongodb-replica-set: test-rs
          mongodb-port: 27017

      # 🎯 NEW: Setup test database
      - name: Setup test database
        run: |
          npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'mongodb://localhost:27017/netflix-test?replicaSet=test-rs' }}

      # 🎯 NEW: Seed test data (if you have a seed script)
      - name: Seed test database
        run: |
          npx prisma db seed || echo "No seed script found, skipping..."
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'mongodb://localhost:27017/netflix-test?replicaSet=test-rs' }}

      # 🎯 NEW: Ensure Prisma Client is generated before creating test user
      - name: Generate Prisma Client for test user script
        run: npx prisma generate

      # Install tsx
      - name: Install tsx for TypeScript execution
        run: npm install -g tsx

      # 🎯 NEW: Create test user for E2E tests
      - name: Create test user
        run: npm run setup:test-user
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'mongodb://localhost:27017/netflix-test?replicaSet=test-rs' }}
          E2E_EMAIL: test@gmail.com
          E2E_PASSWORD: Test1234

      - name: Build application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true
          # 🎯 Add required environment variables for build
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'mongodb://localhost:27017/netflix-test?replicaSet=test-rs' }}
          NEXTAUTH_JWT_SECRET: ${{ secrets.NEXTAUTH_JWT_SECRET || 'test-jwt-secret-key-for-ci' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-key-for-ci' }}
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}

      - name: Run Playwright tests
        run: |
          # Create test-results directory if it doesn't exist
          mkdir -p test-results
          # Run Playwright tests
          npx playwright test
        env:
          CI: true
          # 🎯 Critical environment variables for E2E tests
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'mongodb://localhost:27017/netflix-test?replicaSet=test-rs' }}
          NEXTAUTH_JWT_SECRET: ${{ secrets.NEXTAUTH_JWT_SECRET || 'test-jwt-secret-key-for-ci' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-key-for-ci' }}
          NEXTAUTH_URL: http://localhost:3000
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}
        continue-on-error: true

      - name: List test output files
        if: always()
        run: |
          echo "=== Playwright Report ==="
          ls -la playwright-report/ || echo "No playwright-report directory"
          echo ""
          echo "=== Test Results ==="
          ls -la test-results/ || echo "No test-results directory"
          echo ""
          echo "=== Current Directory ==="
          ls -la

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results (screenshots & videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ matrix.node-version }}
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

      # 🎯 NEW: Upload trace files for debugging
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.node-version }}
          path: test-results/**/*.zip
          retention-days: 30
          if-no-files-found: ignore

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 7

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  publish-test-results:
    name: Publish Test Results to GitHub Pages
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Debug - List artifact structure
        run: |
          echo "📁 Artifacts directory structure:"
          find artifacts/ -type f -name "*.json" | head -20
          echo ""
          echo "🔍 Looking specifically for e2e-results.json:"
          find artifacts/ -name "e2e-results.json" -exec ls -lh {} \;
          echo ""
          echo "📊 E2E test results directory contents:"
          ls -la artifacts/e2e-test-results-20.x/ || echo "Directory not found"

      - name: Checkout main branch for dashboard scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: main-branch
          sparse-checkout: |
            scripts/dashboard-template.html
            scripts/generate-dashboard.ts
            scripts/generate-test-result.ts

      - name: Install tsx for TypeScript execution
        run: npm install -g tsx

      - name: Generate test results
        run: tsx main-branch/scripts/generate-test-result.ts

      - name: Generate HTML dashboard
        run: |
          # Create scripts directory first
          mkdir -p scripts

          # Verify source files exist
          echo "Checking source files in main-branch..."
          ls -la main-branch/scripts/

          # Copy scripts to current directory
          cp main-branch/scripts/dashboard-template.html scripts/dashboard-template.html
          cp main-branch/scripts/generate-dashboard.ts scripts/generate-dashboard.ts

          # Verify files were copied
          echo "Checking copied files..."
          ls -la scripts/

          # Generate the dashboard
          tsx scripts/generate-dashboard.ts

          # Verify output was created
          echo "Checking generated output..."
          ls -la index.html

          echo "✅ Dashboard generated successfully"

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update test results - Run #${{ github.run_number }}" || echo "No changes to commit"
          git push origin gh-pages || echo "Nothing to push"

  deploy-preview:
    name: Deploy Preview (Vercel)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, build, type-check]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          github-comment: true
        continue-on-error: true

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, build, type-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          scope: ${{ secrets.VERCEL_ORG_ID }}
        continue-on-error: true
