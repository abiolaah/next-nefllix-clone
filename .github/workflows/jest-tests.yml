name: Netflix Clone CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Runs every Friday at 11 PM UTC
    - cron: "0 23 * * FRI"
  workflow_dispatch: # Allow manual run

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Run unit tests
        run: |
          mkdir -p test-results
          npm run test:unit -- --ci --coverage --watchAll=false --json --outputFile=test-results/unit-results.json || true
        env:
          CI: true
        continue-on-error: true

      - name: Upload unit test coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unit-tests
          name: codecov-unit-${{ matrix.node-version }}
          fail_ci_if_error: false

      - name: Archive unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.node-version }}
          path: |
            coverage/
            test-results/
          retention-days: 30

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run integration tests
        run: |
          mkdir -p test-results
          npm run test:integration -- --ci --coverage --watchAll=false --json --outputFile=test-results/integration-results.json || true
        env:
          CI: true
        continue-on-error: true

      - name: Upload integration test coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: integration-tests
          name: codecov-integration-${{ matrix.node-version }}
          fail_ci_if_error: false

      - name: Archive integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ matrix.node-version }}
          path: |
            coverage/
            test-results/
          retention-days: 30

  e2e-tests:
    name: Run E2E Tests (Playwright)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      # 🎯 NEW: Setup MongoDB for E2E tests
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: "6.0"
          mongodb-replica-set: test-rs
          mongodb-port: 27017

      # 🎯 NEW: Setup test database
      - name: Setup test database
        run: |
          npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'mongodb://localhost:27017/netflix-test?replicaSet=test-rs' }}

      # 🎯 NEW: Seed test data (if you have a seed script)
      - name: Seed test database
        run: |
          npx prisma db seed || echo "No seed script found, skipping..."
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'mongodb://localhost:27017/netflix-test?replicaSet=test-rs' }}

      # 🎯 NEW: Ensure Prisma Client is generated before creating test user
      - name: Generate Prisma Client for test user script
        run: npx prisma generate

      # 🎯 NEW: Create test user for E2E tests
      - name: Create test user
        # run: tsx scripts/create-test-user.ts
        run: nom run setup:test-user
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'mongodb://localhost:27017/netflix-test?replicaSet=test-rs' }}
          E2E_EMAIL: test@gmail.com
          E2E_PASSWORD: Test1234

      - name: Build application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true
          # 🎯 Add required environment variables for build
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'mongodb://localhost:27017/netflix-test?replicaSet=test-rs' }}
          NEXTAUTH_JWT_SECRET: ${{ secrets.NEXTAUTH_JWT_SECRET || 'test-jwt-secret-key-for-ci' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-key-for-ci' }}
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}

      - name: Run Playwright tests
        run: |
          # Create test-results directory if it doesn't exist
          mkdir -p test-results
          # Run Playwright tests
          npx playwright test
        env:
          CI: true
          # 🎯 Critical environment variables for E2E tests
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'mongodb://localhost:27017/netflix-test?replicaSet=test-rs' }}
          NEXTAUTH_JWT_SECRET: ${{ secrets.NEXTAUTH_JWT_SECRET || 'test-jwt-secret-key-for-ci' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-key-for-ci' }}
          NEXTAUTH_URL: http://localhost:3000
          E2E_EMAIL: test@gmail.com
          E2E_PASSWORD: Test1234
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}
        continue-on-error: true

      - name: List test output files
        if: always()
        run: |
          echo "=== Playwright Report ==="
          ls -la playwright-report/ || echo "No playwright-report directory"
          echo ""
          echo "=== Test Results ==="
          ls -la test-results/ || echo "No test-results directory"
          echo ""
          echo "=== Current Directory ==="
          ls -la

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results (screenshots & videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ matrix.node-version }}
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

      # 🎯 NEW: Upload trace files for debugging
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.node-version }}
          path: test-results/**/*.zip
          retention-days: 30
          if-no-files-found: ignore

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 7

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  publish-test-results:
    name: Publish Test Results to GitHub Pages
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Setup Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Generate test results with Node.js
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');

          // Create results directory if it doesn't exist
          const resultsDir = 'test-results';
          if (!fs.existsSync(resultsDir)) {
            fs.mkdirSync(resultsDir, { recursive: true });
          }

          // Generate timestamp
          const timestamp = new Date().toISOString();
          const runId = process.env.GITHUB_RUN_ID || 'unknown';
          const runNumber = process.env.GITHUB_RUN_NUMBER || 'unknown';
          const commitSha = (process.env.GITHUB_SHA || 'unknown').substring(0, 7);

          // Collect test results
          const testData = {
            timestamp,
            run_id: runId,
            run_number: runNumber,
            commit_sha: commitSha,
            unit: [],
            integration: [],
            e2e: []
          };

          // Helper function to safely read JSON
          function safeReadJSON(filePath) {
            try {
              if (fs.existsSync(filePath)) {
                const content = fs.readFileSync(filePath, 'utf8');
                console.log(`Reading ${filePath}...`);
                return JSON.parse(content);
              } else {
                console.log(`File not found: ${filePath}`);
              }
            } catch (error) {
              console.log(`Error reading ${filePath}:`, error.message);
            }
            return null;
          }

          // Helper function to recursively find files
          function findFiles(dir, pattern) {
            const results = [];
            if(!fs.existsSync(dir)) return results;

            const files = fs.readdirSync(dir);
            for (const file of files){
              const filePath = path.join(dir, file);
              const stat = fs.statSync(filePath);
              
              if (stat.isDirectory()) {
                results.push(...findFiles(filePath, pattern));
              } else if (file.match(pattern)) {
                results.push(filePath);
              }
            }
            return results;
          }

          console.log('Looking for test results in artifacts directory...');

          // Process unit tests
          ['18.x', '20.x'].forEach(nodeVersion => {
            const unitPath = `artifacts/unit-test-results-${nodeVersion}/test-results/unit-results.json`;
            console.log(`Checking for unit tests: ${unitPath}`);
            const data = safeReadJSON(unitPath);
            if (data) {
              console.log(`Found unit test data for ${nodeVersion}:`, data);
              testData.unit.push({
                node_version: nodeVersion,
                success: data.success || false,
                numTotalTests: data.numTotalTests || 0,
                numPassedTests: data.numPassedTests || 0,
                numFailedTests: data.numFailedTests || 0,
                numPendingTests: data.numPendingTests || 0
              });
            }
          });

          // Process integration tests
          ['18.x', '20.x'].forEach(nodeVersion => {
            const intPath = `artifacts/integration-test-results-${nodeVersion}/test-results/integration-results.json`;
            console.log(`Checking for integration tests: ${intPath}`);
            const data = safeReadJSON(intPath);
            if (data) {
              console.log(`Found integration test data for ${nodeVersion}:`, data);
              testData.integration.push({
                node_version: nodeVersion,
                success: data.success || false,
                numTotalTests: data.numTotalTests || 0,
                numPassedTests: data.numPassedTests || 0,
                numFailedTests: data.numFailedTests || 0,
                numPendingTests: data.numPendingTests || 0
              });
            }
          });

          // Process E2E tests (Playwright)
          console.log('Checking for E2E tests...');
          const e2eJsonPath = 'artifacts/e2e-test-results-20.x/test-results/e2e-results.json';
          const e2eData = safeReadJSON(e2eJsonPath);

          if (e2eData) {
            console.log('Found E2E test data:', e2eData);
            // Playwright JSON reporter format
            const suites = e2eData.suites || [];
            let totalTests = 0;
            let passedTests = 0;
            let failedTests = 0;
            
            function countTests(suite) {
              if (suite.specs) {
                suite.specs.forEach(spec => {
                  totalTests++;
                  if (spec.ok) passedTests++;
                  else failedTests++;
                });
              }
              if (suite.suites) {
                suite.suites.forEach(s => countTests(s));
              }
            }
            
            suites.forEach(suite => countTests(suite));
            
            testData.e2e.push({
              node_version: '20.x',
              success: failedTests === 0,
              numTotalTests: totalTests,
              numPassedTests: passedTests,
              numFailedTests: failedTests,
              numPendingTests: 0
            });
          } else {
            // Fallback: check if playwright report exists
            const playwrightDir = 'artifacts/playwright-report-20.x';
            if (fs.existsSync(playwrightDir)) {
              console.log('Found Playwright report directory');
              testData.e2e.push({
                node_version: '20.x',
                success: true,
                numTotalTests: 0,
                numPassedTests: 0,
                numFailedTests: 0,
                numPendingTests: 0,
                note: 'See Playwright report for details'
              });
            }
          }

          console.log('\nFinal test data:', JSON.stringify(testData, null, 2));

          // Load existing results
          const historyFile = path.join(resultsDir, 'history.json');
          let history = [];
          if (fs.existsSync(historyFile)) {
            try {
              const content = fs.readFileSync(historyFile, 'utf8');
              history = JSON.parse(content);
            } catch (error) {
              console.log('Error reading history, starting fresh:', error.message);
              history = [];
            }
          }

          // Append new results
          history.push(testData);

          // Keep only last 100 runs
          if (history.length > 100) {
            history = history.slice(-100);
          }

          // Save history
          fs.writeFileSync(historyFile, JSON.stringify(history, null, 2));

          console.log(`\n✅ Saved test results for run #${runNumber}`);
          console.log(`📊 Total runs in history: ${history.length}`);
          console.log(`📋 Unit tests: ${testData.unit.length} node versions`);
          console.log(`🔗 Integration tests: ${testData.integration.length} node versions`);
          console.log(`🎭 E2E tests: ${testData.e2e.length} suite(s)`);
          EOF

      - name: Generate HTML dashboard
        run: |
          cat > index.html << 'EOF'
          <!DOCTYPE html>
            <html lang="en">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Netflix Clone - Test Results Dashboard</title>
                <style>
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body {
                        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                        background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
                        color: #e5e5e5;
                        padding: 20px;
                        min-height: 100vh;
                    }
                    .container { max-width: 1400px; margin: 0 auto; }
                    h1 {
                        color: #e50914;
                        margin-bottom: 10px;
                        font-size: 2.5em;
                        text-align: center;
                    }
                    .subtitle {
                        text-align: center;
                        color: #999;
                        margin-bottom: 40px;
                        font-size: 1.1em;
                    }
                    .stats {
                        display: grid;
                        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                        gap: 20px;
                        margin-bottom: 40px;
                    }
                    .stat-card {
                        background: rgba(255, 255, 255, 0.05);
                        border-radius: 12px;
                        padding: 25px;
                        border: 1px solid rgba(255, 255, 255, 0.1);
                        transition: transform 0.2s;
                    }
                    .stat-card:hover { transform: translateY(-5px); }
                    .stat-card h3 {
                        color: #999;
                        font-size: 0.9em;
                        text-transform: uppercase;
                        margin-bottom: 10px;
                    }
                    .stat-value {
                        font-size: 2.5em;
                        font-weight: bold;
                        color: #e50914;
                    }
                    .section {
                        background: rgba(255, 255, 255, 0.05);
                        border-radius: 12px;
                        padding: 30px;
                        margin-bottom: 30px;
                        border: 1px solid rgba(255, 255, 255, 0.1);
                    }
                    .section h2 {
                        color: #e50914;
                        margin-bottom: 20px;
                        font-size: 1.8em;
                        display: flex;
                        align-items: center;
                        gap: 10px;
                    }
                    .badge {
                        display: inline-block;
                        padding: 5px 12px;
                        border-radius: 20px;
                        font-size: 0.5em;
                        font-weight: normal;
                    }
                    .badge.unit { background: #2196F3; color: #b71c00  }
                    .badge.integration { background: #ff9800; color: #D42A0B }
                    .badge.e2e { background: #4caf50; color: #D82100}
                    table {
                        width: 100%;
                        border-collapse: collapse;
                        margin-top: 20px;
                    }
                    th, td {
                        padding: 15px;
                        text-align: left;
                        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                    }
                    th {
                        background: rgba(229, 9, 20, 0.1);
                        color: #e50914;
                        font-weight: 600;
                    }
                    tr:hover { background: rgba(255, 255, 255, 0.02); }
                    .status-pass { color: #4caf50; font-weight: bold; }
                    .status-fail { color: #f44336; font-weight: bold; }
                    .status-skipped { color: #999; font-style: italic; }
                    .chart-container {
                        margin-top: 30px;
                        background: rgba(255, 255, 255, 0.02);
                        border-radius: 8px;
                        padding: 20px;
                    }
                    .history-item {
                        padding: 10px;
                        margin: 5px 0;
                        background: rgba(255, 255, 255, 0.03);
                        border-radius: 6px;
                        border-left: 3px solid #e50914;
                    }
                    .history-item:hover {
                        background: rgba(255, 255, 255, 0.05);
                    }
                    .loading {
                        text-align: center;
                        padding: 50px;
                        color: #999;
                    }
                    .filter-buttons {
                        display: flex;
                        gap: 10px;
                        margin-bottom: 20px;
                        flex-wrap: wrap;
                    }
                    .filter-btn {
                        padding: 8px 16px;
                        background: rgba(255, 255, 255, 0.1);
                        border: 1px solid rgba(255, 255, 255, 0.2);
                        border-radius: 6px;
                        color: #e5e5e5;
                        cursor: pointer;
                        transition: all 0.2s;
                    }
                    .filter-btn:hover {
                        background: rgba(229, 9, 20, 0.2);
                        border-color: #e50914;
                    }
                    .filter-btn.active {
                        background: #e50914;
                        border-color: #e50914;
                    }
                    .no-tests {
                        padding: 20px;
                        text-align: center;
                        color: #999;
                        font-style: italic;
                    }
                </style>
            </head>
            <body>
                <div class="container">
                    <h1>🎬 Netflix Clone Test Dashboard</h1>
                    <p class="subtitle">Continuous Integration Test Results</p>
                    
                    <div class="stats" id="stats">
                        <div class="stat-card">
                            <h3>Total Runs</h3>
                            <div class="stat-value" id="totalRuns">-</div>
                        </div>
                        <div class="stat-card">
                            <h3>Last Run</h3>
                            <div class="stat-value" style="font-size: 1.2em;" id="lastRun">-</div>
                        </div>
                        <div class="stat-card">
                            <h3>Latest Status</h3>
                            <div class="stat-value" style="font-size: 1.5em;" id="latestStatus">-</div>
                        </div>
                    </div>

                    <div class="section">
                        <h2>📊 Test History</h2>
                        <div class="filter-buttons">
                            <button class="filter-btn active" onclick="showHistory(10)">Last 10 Runs</button>
                            <button class="filter-btn" onclick="showHistory(25)">Last 25 Runs</button>
                            <button class="filter-btn" onclick="showHistory(50)">Last 50 Runs</button>
                            <button class="filter-btn" onclick="showHistory(100)">All Runs</button>
                        </div>
                        <div id="historyContainer" class="loading">Loading...</div>
                    </div>
                </div>

                <script>
                    let fullHistory = [];

                    async function loadTestResults() {
                        try {
                            const response = await fetch('test-results/history.json');
                            fullHistory = await response.json();
                            
                            if (fullHistory.length === 0) {
                                document.getElementById('totalRuns').textContent = '0';
                                document.querySelectorAll('.loading').forEach(el => {
                                    el.innerHTML = '<p class="no-tests">No test results available yet.</p>';
                                });
                                return;
                            }

                            // Update stats
                            document.getElementById('totalRuns').textContent = fullHistory.length;
                            const lastRun = fullHistory[fullHistory.length - 1];
                            const date = new Date(lastRun.timestamp);
                            document.getElementById('lastRun').textContent = date.toLocaleDateString();

                            // Calculate latest status
                            const hasFailures = (lastRun.unit && lastRun.unit.some(t => t.numFailedTests > 0)) ||
                                              (lastRun.integration && lastRun.integration.some(t => t.numFailedTests > 0)) ||
                                              (lastRun.e2e && lastRun.e2e.some(t => t.numFailedTests > 0));
                            
                            const hasTests = (lastRun.unit && lastRun.unit.length > 0) ||
                                          (lastRun.integration && lastRun.integration.length > 0) ||
                                          (lastRun.e2e && lastRun.e2e.length > 0);

                            if (!hasTests) {
                                document.getElementById('latestStatus').innerHTML = '<span class="status-skipped">NO TESTS</span>';
                            } else {
                                document.getElementById('latestStatus').innerHTML = hasFailures ? 
                                    '<span class="status-fail">FAILED</span>' : 
                                    '<span class="status-pass">PASSED</span>';
                            }

                            // Show default history
                            showHistory(10);

                        } catch (error) {
                            console.error('Error loading test results:', error);
                            document.querySelectorAll('.loading').forEach(el => {
                                el.innerHTML = '<p class="no-tests">Error loading test results.</p>';
                            });
                        }
                    }

                    function renderRunDetails(run, testType, badge) {
                        const tests = run[testType];
                        
                        if (!tests || tests.length === 0) {
                            return '<p class="no-tests">No tests run for this suite.</p>';
                        }

                        let html = '<table><thead><tr><th>Node Version</th><th>Total</th><th>Passed</th><th>Failed</th><th>Pending</th><th>Status</th></tr></thead><tbody>';
                        
                        tests.forEach(test => {
                            const status = test.success || test.numFailedTests === 0 ? 'PASS' : 'FAIL';
                            const statusClass = status === 'PASS' ? 'status-pass' : 'status-fail';
                            
                            html += `
                                <tr>
                                    <td>${test.node_version || 'N/A'}</td>
                                    <td>${test.numTotalTests || '0'}</td>
                                    <td class="status-pass">${test.numPassedTests || '0'}</td>
                                    <td class="${test.numFailedTests > 0 ? 'status-fail' : ''}">${test.numFailedTests || '0'}</td>
                                    <td>${test.numPendingTests || '0'}</td>
                                    <td class="${statusClass}">${status}</td>
                                </tr>
                            `;
                        });
                        
                        html += '</tbody></table>';
                        return html;
                    }

                    function showHistory(limit) {
                        // Update active button
                        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                        event.target.classList.add('active');

                        const container = document.getElementById('historyContainer');
                        const history = fullHistory.slice(-limit).reverse();

                        if (history.length === 0) {
                            container.innerHTML = '<p class="no-tests">No history available.</p>';
                            return;
                        }

                        let html = '';
                        history.forEach(run => {
                            const date = new Date(run.timestamp);
                            
                            // Calculate totals safely
                            const unitTotal = run.unit ? run.unit.reduce((sum, t) => sum + (t.numTotalTests || 0), 0) : 0;
                            const unitPassed = run.unit ? run.unit.reduce((sum, t) => sum + (t.numPassedTests || 0), 0) : 0;
                            const intTotal = run.integration ? run.integration.reduce((sum, t) => sum + (t.numTotalTests || 0), 0) : 0;
                            const intPassed = run.integration ? run.integration.reduce((sum, t) => sum + (t.numPassedTests || 0), 0) : 0;
                            const e2eTotal = run.e2e ? run.e2e.reduce((sum, t) => sum + (t.numTotalTests || 0), 0) : 0;
                            const e2ePassed = run.e2e ? run.e2e.reduce((sum, t) => sum + (t.numPassedTests || 0), 0) : 0;
                            
                            const hasFailures = (run.unit && run.unit.some(t => t.numFailedTests > 0)) ||
                                              (run.integration && run.integration.some(t => t.numFailedTests > 0)) ||
                                              (run.e2e && run.e2e.some(t => t.numFailedTests > 0));
                            
                            const hasTests = unitTotal > 0 || intTotal > 0 || e2eTotal > 0;
                            
                            let statusHtml;
                            let statusClass;
                            if (!hasTests) {
                                statusHtml = '⊘ NO TESTS';
                                statusClass = 'status-skipped';
                            } else if (hasFailures) {
                                statusHtml = '❌ FAILED';
                                statusClass = 'status-fail';
                            } else {
                                statusHtml = '✅ PASSED';
                                statusClass = 'status-pass';
                            }
                            
                            html += `
                                <div class="history-item">
                                    <div style="margin-bottom: 15px;">
                                        <strong>Run #${run.run_number}</strong> - ${date.toLocaleString()} 
                                        <span style="float: right;" class="${statusClass}">
                                            ${statusHtml}
                                        </span>
                                        <br>
                                        <small style="color: #999;">
                                            Commit: ${run.commit_sha} | 
                                            Unit: ${unitTotal > 0 ? `${unitPassed}/${unitTotal}` : 'Not run'} | 
                                            Integration: ${intTotal > 0 ? `${intPassed}/${intTotal}` : 'Not run'} |
                                            E2E: ${e2eTotal > 0 ? `${e2ePassed}/${e2eTotal}` : 'Not run'}
                                        </small>
                                    </div>
                                    
                                    <div style="margin-top: 15px;">
                                        <div style="margin-bottom: 10px;">
                                            <strong><span class="badge unit" style="font-size: 0.85em;">Unit Tests</span></strong>
                                            ${renderRunDetails(run, 'unit')}
                                        </div>
                                        
                                        <div style="margin-bottom: 10px;">
                                            <strong><span class="badge integration" style="font-size: 0.85em;">Integration Tests</span></strong>
                                            ${renderRunDetails(run, 'integration')}
                                        </div>
                                        
                                        <div>
                                            <strong><span class="badge e2e" style="font-size: 0.85em;">E2E Tests</span></strong>
                                            ${renderRunDetails(run, 'e2e')}
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        
                        container.innerHTML = html;
                    }

                    // Load results on page load
                    loadTestResults();
                </script>
            </body>
            </html>
          EOF

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update test results - Run #${{ github.run_number }}" || echo "No changes to commit"
          git push origin gh-pages || echo "Nothing to push"

  deploy-preview:
    name: Deploy Preview (Vercel)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, build, type-check]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          github-comment: true
        continue-on-error: true

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, build, type-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          scope: ${{ secrets.VERCEL_ORG_ID }}
        continue-on-error: true
