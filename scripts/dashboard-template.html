<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix Clone - Test Results Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
        color: #e5e5e5;
        padding: 20px;
        min-height: 100vh;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
      }
      h1 {
        color: #e50914;
        margin-bottom: 10px;
        font-size: 2.5em;
        text-align: center;
      }
      .subtitle {
        text-align: center;
        color: #999;
        margin-bottom: 40px;
        font-size: 1.1em;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }
      .stat-card {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 25px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: transform 0.2s;
      }
      .stat-card:hover {
        transform: translateY(-5px);
      }
      .stat-card h3 {
        color: #999;
        font-size: 0.9em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .stat-value {
        font-size: 2.5em;
        font-weight: bold;
        color: #e50914;
      }
      .section {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 30px;
        margin-bottom: 30px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .section h2 {
        color: #e50914;
        margin-bottom: 20px;
        font-size: 1.8em;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .badge {
        display: inline-block;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.5em;
        font-weight: normal;
      }
      .badge.unit {
        background: #2196f3;
      }
      .badge.integration {
        background: #ff9800;
      }
      .badge.e2e {
        background: #4caf50;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      th {
        background: rgba(229, 9, 20, 0.1);
        color: #e50914;
        font-weight: 600;
      }
      tr:hover {
        background: rgba(255, 255, 255, 0.02);
      }
      .status-pass {
        color: #4caf50;
        font-weight: bold;
      }
      .status-fail {
        color: #f44336;
        font-weight: bold;
      }
      .status-skipped {
        color: #999;
        font-style: italic;
      }
      .chart-container {
        margin-top: 30px;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 8px;
        padding: 20px;
      }
      .history-item {
        padding: 10px;
        margin: 5px 0;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 6px;
        border-left: 3px solid #e50914;
      }
      .history-item:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      .loading {
        text-align: center;
        padding: 50px;
        color: #999;
      }
      .filter-buttons {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .filter-btn {
        padding: 8px 16px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        color: #e5e5e5;
        cursor: pointer;
        transition: all 0.2s;
      }
      .filter-btn:hover {
        background: rgba(229, 9, 20, 0.2);
        border-color: #e50914;
      }
      .filter-btn.active {
        background: #e50914;
        border-color: #e50914;
      }
      .no-tests {
        padding: 20px;
        text-align: center;
        color: #999;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎬 Netflix Clone Test Dashboard</h1>
      <p class="subtitle">Continuous Integration Test Results</p>

      <div class="stats" id="stats">
        <div class="stat-card">
          <h3>Total Runs</h3>
          <div class="stat-value" id="totalRuns">-</div>
        </div>
        <div class="stat-card">
          <h3>Last Run</h3>
          <div class="stat-value" style="font-size: 1.2em" id="lastRun">-</div>
        </div>
        <div class="stat-card">
          <h3>Latest Status</h3>
          <div class="stat-value" style="font-size: 1.5em" id="latestStatus">
            -
          </div>
        </div>
      </div>

      <div class="section">
        <h2>📊 Test History</h2>
        <div class="filter-buttons">
          <button class="filter-btn active" onclick="showHistory(10)">
            Last 10 Runs
          </button>
          <button class="filter-btn" onclick="showHistory(25)">
            Last 25 Runs
          </button>
          <button class="filter-btn" onclick="showHistory(50)">
            Last 50 Runs
          </button>
          <button class="filter-btn" onclick="showHistory(100)">
            All Runs
          </button>
        </div>
        <div id="historyContainer" class="loading">Loading...</div>
      </div>
    </div>

    <script>
      let fullHistory = [];

      async function loadTestResults() {
        try {
          const response = await fetch("test-results/history.json");
          fullHistory = await response.json();

          if (fullHistory.length === 0) {
            document.getElementById("totalRuns").textContent = "0";
            document.querySelectorAll(".loading").forEach((el) => {
              el.innerHTML =
                '<p class="no-tests">No test results available yet.</p>';
            });
            return;
          }

          // Update stats
          document.getElementById("totalRuns").textContent = fullHistory.length;
          const lastRun = fullHistory[fullHistory.length - 1];
          const date = new Date(lastRun.timestamp);
          document.getElementById("lastRun").textContent =
            date.toLocaleDateString();

          // Calculate latest status
          const hasFailures =
            (lastRun.unit && lastRun.unit.some((t) => t.numFailedTests > 0)) ||
            (lastRun.integration &&
              lastRun.integration.some((t) => t.numFailedTests > 0)) ||
            (lastRun.e2e && lastRun.e2e.some((t) => t.numFailedTests > 0));

          const hasTests =
            (lastRun.unit && lastRun.unit.length > 0) ||
            (lastRun.integration && lastRun.integration.length > 0) ||
            (lastRun.e2e && lastRun.e2e.length > 0);

          if (!hasTests) {
            document.getElementById("latestStatus").innerHTML =
              '<span class="status-skipped">NO TESTS</span>';
          } else {
            document.getElementById("latestStatus").innerHTML = hasFailures
              ? '<span class="status-fail">FAILED</span>'
              : '<span class="status-pass">PASSED</span>';
          }

          // Show default history
          showHistory(10);
        } catch (error) {
          console.error("Error loading test results:", error);
          document.querySelectorAll(".loading").forEach((el) => {
            el.innerHTML =
              '<p class="no-tests">Error loading test results.</p>';
          });
        }
      }

      function renderRunDetails(run, testType) {
        const tests = run[testType];

        if (!tests || tests.length === 0) {
          return '<p class="no-tests">No tests run for this suite.</p>';
        }

        let html =
          "<table><thead><tr><th>Node Version</th><th>Total</th><th>Passed</th><th>Failed</th><th>Pending</th><th>Status</th></tr></thead><tbody>";

        tests.forEach((test) => {
          const status =
            test.success || test.numFailedTests === 0 ? "PASS" : "FAIL";
          const statusClass = status === "PASS" ? "status-pass" : "status-fail";

          html += `
                    <tr>
                        <td>${test.node_version || "N/A"}</td>
                        <td>${test.numTotalTests || "0"}</td>
                        <td class="status-pass">${
                          test.numPassedTests || "0"
                        }</td>
                        <td class="${
                          test.numFailedTests > 0 ? "status-fail" : ""
                        }">${test.numFailedTests || "0"}</td>
                        <td>${test.numPendingTests || "0"}</td>
                        <td class="${statusClass}">${status}</td>
                    </tr>
                `;
        });

        html += "</tbody></table>";
        return html;
      }

      function showHistory(limit) {
        // Update active button
        document
          .querySelectorAll(".filter-btn")
          .forEach((btn) => btn.classList.remove("active"));
        event.target.classList.add("active");

        const container = document.getElementById("historyContainer");
        const history = fullHistory.slice(-limit).reverse();

        if (history.length === 0) {
          container.innerHTML = '<p class="no-tests">No history available.</p>';
          return;
        }

        let html = "";
        history.forEach((run) => {
          const date = new Date(run.timestamp);

          // Calculate totals safely
          const unitTotal = run.unit
            ? run.unit.reduce((sum, t) => sum + (t.numTotalTests || 0), 0)
            : 0;
          const unitPassed = run.unit
            ? run.unit.reduce((sum, t) => sum + (t.numPassedTests || 0), 0)
            : 0;
          const intTotal = run.integration
            ? run.integration.reduce(
                (sum, t) => sum + (t.numTotalTests || 0),
                0
              )
            : 0;
          const intPassed = run.integration
            ? run.integration.reduce(
                (sum, t) => sum + (t.numPassedTests || 0),
                0
              )
            : 0;
          const e2eTotal = run.e2e
            ? run.e2e.reduce((sum, t) => sum + (t.numTotalTests || 0), 0)
            : 0;
          const e2ePassed = run.e2e
            ? run.e2e.reduce((sum, t) => sum + (t.numPassedTests || 0), 0)
            : 0;

          const hasFailures =
            (run.unit && run.unit.some((t) => t.numFailedTests > 0)) ||
            (run.integration &&
              run.integration.some((t) => t.numFailedTests > 0)) ||
            (run.e2e && run.e2e.some((t) => t.numFailedTests > 0));

          const hasTests = unitTotal > 0 || intTotal > 0 || e2eTotal > 0;

          let statusHtml;
          let statusClass;
          if (!hasTests) {
            statusHtml = "⊘ NO TESTS";
            statusClass = "status-skipped";
          } else if (hasFailures) {
            statusHtml = "❌ FAILED";
            statusClass = "status-fail";
          } else {
            statusHtml = "✅ PASSED";
            statusClass = "status-pass";
          }

          html += `
                    <div class="history-item">
                        <div style="margin-bottom: 15px;">
                            <strong>Run #${
                              run.run_number
                            }</strong> - ${date.toLocaleString()} 
                            <span style="float: right;" class="${statusClass}">
                                ${statusHtml}
                            </span>
                            <br>
                            <small style="color: #999;">
                                Commit: ${run.commit_sha} | 
                                Unit: ${
                                  unitTotal > 0
                                    ? `${unitPassed}/${unitTotal}`
                                    : "Not run"
                                } | 
                                Integration: ${
                                  intTotal > 0
                                    ? `${intPassed}/${intTotal}`
                                    : "Not run"
                                } |
                                E2E: ${
                                  e2eTotal > 0
                                    ? `${e2ePassed}/${e2eTotal}`
                                    : "Not run"
                                }
                            </small>
                        </div>
                        
                        <div style="margin-top: 15px;">
                            <div style="margin-bottom: 10px;">
                                <strong><span class="badge unit" style="font-size: 0.85em;">Unit Tests</span></strong>
                                ${renderRunDetails(run, "unit")}
                            </div>
                            
                            <div style="margin-bottom: 10px;">
                                <strong><span class="badge integration" style="font-size: 0.85em;">Integration Tests</span></strong>
                                ${renderRunDetails(run, "integration")}
                            </div>
                            
                            <div>
                                <strong><span class="badge e2e" style="font-size: 0.85em;">E2E Tests</span></strong>
                                ${renderRunDetails(run, "e2e")}
                            </div>
                        </div>
                    </div>
                `;
        });

        container.innerHTML = html;
      }

      // Load results on page load
      loadTestResults();
    </script>
  </body>
</html>
